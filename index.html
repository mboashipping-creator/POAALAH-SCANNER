<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POAALAH — Scanner billets</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .app {
      width: 100%;
      max-width: 520px;
      background: #1f2937;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 15px 40px rgba(0,0,0,.35);
    }
    h1 { text-align: center; margin: 0 0 8px; font-size: 28px; }
    .subtitle { text-align: center; color: #d1d5db; margin-bottom: 22px; }
    label { display: block; margin-bottom: 7px; font-weight: bold; }
    input {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      font-size: 18px;
      margin-bottom: 14px;
    }
    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      background: white;
      color: #111827;
      margin-bottom: 12px;
    }
    #reader {
      width: 100%;
      margin-top: 15px;
      overflow: hidden;
      border-radius: 16px;
      background: #000;
    }
    .status {
      text-align: center;
      min-height: 25px;
      margin-top: 12px;
      color: #fbbf24;
    }
    .hidden { display: none; }
    .small {
      text-align: center;
      color: #9ca3af;
      font-size: 13px;
      margin-top: 15px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>POAALAH MIDLANDS</h1>
    <div class="subtitle">Contrôle des billets — 20th Anniversary</div>

    <label for="pin">Code personnel</label>
    <input id="pin" type="password" inputmode="numeric" placeholder="Entrer le code">

    <button id="startBtn" onclick="startScanner()">📷 DÉMARRER LE SCANNER</button>

    <div id="reader" class="hidden"></div>
    <div id="status" class="status"></div>

    <form id="verifyForm" method="POST" action="https://script.google.com/macros/s/AKfycbw67DipS-ZiVHUZchHVcUXUs-egBcmGIXoL59Vlq9U7PTvTm4IIuFjpP6gJcMCquxwi/exec">
      <input type="hidden" name="ticketId" id="ticketId">
      <input type="hidden" name="pin" id="pinHidden">
    </form>

    <div class="small">
      Autorise la caméra lorsque le navigateur le demande.<br>
      Après le scan, la vérification se fait automatiquement.
    </div>
  </div>

<script>
  let scanner = null;
  let scanning = false;

  async function startScanner() {
    const pin = document.getElementById("pin").value.trim();

    if (!pin) {
      document.getElementById("status").textContent = "⚠️ Entre d'abord le code personnel.";
      return;
    }

    document.getElementById("status").textContent = "Ouverture de la caméra…";
    document.getElementById("reader").classList.remove("hidden");
    document.getElementById("startBtn").disabled = true;

    scanner = new Html5Qrcode("reader");

    try {
      await scanner.start(
        { facingMode: "environment" },
        {
          fps: 10,
          qrbox: { width: 250, height: 250 }
        },
        onScanSuccess,
        function(errorMessage) {}
      );

      scanning = true;
      document.getElementById("status").textContent = "📷 Place le QR code dans le cadre.";

    } catch (error) {
      document.getElementById("status").textContent =
        "❌ Impossible d'ouvrir la caméra. Vérifie que la page est en HTTPS et que la caméra est autorisée.";
      document.getElementById("reader").classList.add("hidden");
      document.getElementById("startBtn").disabled = false;
      scanner = null;
    }
  }

  async function onScanSuccess(decodedText) {
    if (!scanning) return;

    scanning = false;

    try {
      await scanner.stop();
    } catch (e) {}

    document.getElementById("status").textContent = "✅ QR détecté — vérification…";

    const ticketId = String(decodedText || "").trim();

    if (!ticketId) {
      document.getElementById("status").textContent = "❌ QR code vide.";
      document.getElementById("startBtn").disabled = false;
      scanning = false;
      return;
    }

    document.getElementById("ticketId").value = ticketId;
    document.getElementById("pinHidden").value =
      document.getElementById("pin").value.trim();

    document.getElementById("verifyForm").submit();
  }
</script>
</body>
</html>
