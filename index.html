<!DOCTYPE html>

<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>
POAALAH - Scanner
</title>


<script
  src="https://unpkg.com/html5-qrcode"
  type="text/javascript">
</script>


<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  min-height: 100vh;

  padding: 15px;

  font-family: Arial, sans-serif;

  background:
    linear-gradient(
      135deg,
      #061a3a,
      #0066cc,
      #00132d
    );

  color: white;

}

.container {

  width: 100%;

  max-width: 500px;

  margin: auto;

  text-align: center;

}

h1 {

  margin: 10px 0 5px;

  font-size: 30px;

  font-weight: bold;

}

.subtitle {

  font-size: 17px;

  margin-bottom: 20px;

}

.box {

  background: white;

  color: #111;

  border-radius: 18px;

  padding: 20px;

  box-shadow:
    0 8px 30px rgba(0,0,0,.4);

}

label {

  display: block;

  text-align: left;

  font-weight: bold;

  margin-bottom: 6px;

}

input {

  width: 100%;

  padding: 14px;

  border: 2px solid #ddd;

  border-radius: 10px;

  font-size: 18px;

  margin-bottom: 15px;

}

button {

  width: 100%;

  padding: 15px;

  border: none;

  border-radius: 10px;

  background: #0066cc;

  color: white;

  font-size: 18px;

  font-weight: bold;

  margin-bottom: 15px;

}

button:active {

  transform: scale(.98);

}

#reader {

  width: 100%;

  margin-top: 10px;

}

.info {

  margin-top: 15px;

  padding: 12px;

  background: #eef6ff;

  border-radius: 10px;

  color: #164e7a;

  font-size: 14px;

}

.hidden {

  display: none;

}

</style>

</head>


<body>


<div class="container">


  <h1>
    POAALAH MIDLANDS
  </h1>


  <div class="subtitle">

    20th Anniversary
    <br>

    CONTRÔLE DES BILLETS

  </div>


  <div class="box">


    <label for="pin">

      Code du personnel

    </label>


    <input
      id="pin"
      type="password"
      inputmode="numeric"
      placeholder="Code"
      maxlength="10"
      autocomplete="off"
    >


    <button
      id="startButton"
      onclick="startScanner()"
    >

      📷 SCANNER UN BILLET

    </button>


    <div
      id="reader">
    </div>


    <div
      id="info"
      class="info hidden">
    </div>


  </div>


</div>


<!-- ===================================================== -->
<!-- FORMULAIRE INVISIBLE ENVOYÉ À GOOGLE APPS SCRIPT -->
<!-- ===================================================== -->

<form
  id="verifyForm"
  method="POST"
  action="https://script.google.com/macros/s/AKfycbY-xfrOnWuNCWozDFDjTtH6hyJS7EY3eoHht1ePzkLjNiYZDwjOcXMmD5CVdfFPT9q0/exec"
  class="hidden"
>

  <input
    type="hidden"
    name="ticketId"
    id="ticketIdField"
  >

  <input
    type="hidden"
    name="pin"
    id="pinField"
  >

</form>


<script>


/* ==========================================================
   CONFIGURATION
   ========================================================== */

let scanner = null;

let scannerRunning = false;

let scanProcessing = false;


/* ==========================================================
   AU CHARGEMENT
   ========================================================== */

window.addEventListener(
  "load",
  function() {

    const savedPin =
      sessionStorage.getItem(
        "poaalah_scanner_pin"
      );


    if (savedPin) {

      document
        .getElementById("pin")
        .value = savedPin;

    }

  }
);


/* ==========================================================
   DÉMARRER LE SCANNER
   ========================================================== */

function startScanner() {


  const pin =
    document
      .getElementById("pin")
      .value
      .trim();


  if (!pin) {

    showInfo(
      "⚠️ Entre le code du personnel.",
      true
    );

    return;

  }


  /*
   * On mémorise le PIN uniquement
   * pendant la session du navigateur.
   */

  sessionStorage.setItem(
    "poaalah_scanner_pin",
    pin
  );


  if (scannerRunning) {

    return;

  }


  scanProcessing = false;


  hideInfo();


  document
    .getElementById("startButton")
    .disabled = true;


  document
    .getElementById("startButton")
    .innerText =
      "📷 CAMÉRA ACTIVE";


  /*
   * Nettoyage du lecteur
   */

  document
    .getElementById("reader")
    .innerHTML = "";


  scanner =
    new Html5Qrcode("reader");


  scanner
    .start(

      {
        facingMode: "environment"
      },

      {

        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        }

      },

      onScanSuccess,

      function(errorMessage) {

        /*
         * Ne rien afficher.
         * Les petites erreurs de lecture
         * sont normales pendant le scan.
         */

      }

    )

    .then(
      function() {

        scannerRunning = true;

      }
    )

    .catch(
      function(error) {

        scannerRunning = false;

        document
          .getElementById("startButton")
          .disabled = false;

        document
          .getElementById("startButton")
          .innerText =
            "📷 SCANNER UN BILLET";


        showInfo(

          "❌ Impossible d'ouvrir la caméra." +

          "<br><br>" +

          "Vérifie que tu as autorisé " +

          "l'accès à la caméra du navigateur.",

          true

        );

      }
    );

}


/* ==========================================================
   QR DÉTECTÉ
   ========================================================== */

function onScanSuccess(decodedText) {


  if (!scannerRunning) {

    return;

  }


  if (scanProcessing) {

    return;

  }


  scanProcessing = true;


  const ticketId =
    String(decodedText || "")
      .trim();


  const pin =
    document
      .getElementById("pin")
      .value
      .trim();


  if (!ticketId) {

    scanProcessing = false;

    return;

  }


  /*
   * Arrêt immédiat de la caméra.
   */

  stopScanner();


  /*
   * Préparer le formulaire.
   */

  document
    .getElementById("ticketIdField")
    .value =
      ticketId;


  document
    .getElementById("pinField")
    .value =
      pin;


  /*
   * Message temporaire.
   */

  showInfo(
    "⏳ Vérification du billet..."
  );


  /*
   * Envoi vers Apps Script.
   *
   * PAS de google.script.run ici.
   *
   * Le navigateur va recevoir directement
   * la page de résultat générée par Apps Script.
   */

  setTimeout(
    function() {

      document
        .getElementById("verifyForm")
        .submit();

    },
    200
  );

}


/* ==========================================================
   ARRÊTER LA CAMÉRA
   ========================================================== */

function stopScanner() {


  if (!scanner) {

    scannerRunning = false;

    return;

  }


  if (!scannerRunning) {

    return;

  }


  scanner
    .stop()

    .then(
      function() {

        scannerRunning = false;

      }
    )

    .catch(
      function() {

        scannerRunning = false;

      }
    );

}


/* ==========================================================
   MESSAGE
   ========================================================== */

function showInfo(
  message,
  error
) {


  const info =
    document
      .getElementById("info");


  info.innerHTML =
    message;


  info.classList.remove(
    "hidden"
  );


  if (error) {

    info.style.background =
      "#ffe0e0";

    info.style.color =
      "#8b0000";

  }

  else {

    info.style.background =
      "#eef6ff";

    info.style.color =
      "#164e7a";

  }

}


/* ==========================================================
   CACHER MESSAGE
   ========================================================== */

function hideInfo() {

  document
    .getElementById("info")
    .classList
    .add("hidden");

}

</script>


</body>

</html>
