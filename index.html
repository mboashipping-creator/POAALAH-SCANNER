<!DOCTYPE html>

<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>
POAALAH - Scanner
</title>

<!-- ========================================================
     BIBLIOTHÈQUE SCANNER QR
     ======================================================== -->

<script
  src="https://unpkg.com/html5-qrcode"
  type="text/javascript"
></script>


<style>

* {
  box-sizing: border-box;
}


body {

  margin: 0;

  min-height: 100vh;

  padding: 15px;

  font-family: Arial, sans-serif;

  background:
    linear-gradient(
      135deg,
      #061a3a,
      #0066cc,
      #00132d
    );

  color: white;

}


.container {

  width: 100%;

  max-width: 500px;

  margin: auto;

  text-align: center;

}


h1 {

  margin:
    10px 0 5px;

  font-size: 30px;

  font-weight: bold;

}


.subtitle {

  font-size: 17px;

  margin-bottom: 20px;

}


.box {

  background: white;

  color: #111;

  border-radius: 18px;

  padding: 20px;

  box-shadow:
    0 8px 30px
    rgba(0,0,0,.4);

}


label {

  display: block;

  text-align: left;

  font-weight: bold;

  margin-bottom: 6px;

}


input {

  width: 100%;

  padding: 14px;

  border:
    2px solid #ddd;

  border-radius: 10px;

  font-size: 18px;

  margin-bottom: 15px;

}


button {

  width: 100%;

  padding: 15px;

  border: none;

  border-radius: 10px;

  background: #0066cc;

  color: white;

  font-size: 18px;

  font-weight: bold;

  margin-bottom: 15px;

  cursor: pointer;

}


button:disabled {

  opacity: .7;

  cursor: not-allowed;

}


#reader {

  width: 100%;

  margin-top: 10px;

}


.info {

  margin-top: 15px;

  padding: 12px;

  background: #eef6ff;

  border-radius: 10px;

  color: #164e7a;

  font-size: 14px;

}


.hidden {

  display: none;

}

</style>

</head>


<body>


<div class="container">


<h1>
POAALAH MIDLANDS
</h1>


<div class="subtitle">

20th Anniversary<br>

CONTRÔLE DES BILLETS

</div>


<div class="box">


<label for="pin">

Code du personnel

</label>


<input
  id="pin"
  type="password"
  inputmode="numeric"
  placeholder="Code"
  maxlength="10"
  autocomplete="off"
>


<button
  id="startButton"
  type="button"
  onclick="startScanner()"
>

📷 SCANNER UN BILLET

</button>


<div id="reader"></div>


<div
  id="info"
  class="info hidden"
></div>


</div>


</div>


<!-- ========================================================
     FORMULAIRE INVISIBLE
     ENVOI VERS LE BON GOOGLE APPS SCRIPT
     ======================================================== -->

<form
  id="verifyForm"
  method="POST"
  action="https://script.google.com/macros/s/AKfycbyNG45FtGEUxPrjW7EK5sIJlgqFKVMdTpLpVSRSdZdHaGzYZ0N6ysnJpe01dfuPhl_6/exec"
  class="hidden"
>


<input
  type="hidden"
  name="ticketId"
  id="ticketIdField"
>


<input
  type="hidden"
  name="pin"
  id="pinField"
>


</form>


<script>

// ============================================================
// VARIABLES
// ============================================================

let scanner = null;

let scannerRunning = false;

let scanProcessing = false;


// ============================================================
// CHARGEMENT DE LA PAGE
// ============================================================

window.addEventListener(
  "load",
  function() {

    // --------------------------------------------------------
    // RÉCUPÉRER LE PIN DE LA SESSION
    // --------------------------------------------------------

    const savedPin =
      sessionStorage.getItem(
        "poaalah_scanner_pin"
      );


    if (savedPin) {

      document
        .getElementById("pin")
        .value = savedPin;

    }

  }
);


// ============================================================
// DÉMARRER LE SCANNER
// ============================================================

async function startScanner() {

  // ----------------------------------------------------------
  // RÉCUPÉRER LE PIN
  // ----------------------------------------------------------

  let pin =
    document
      .getElementById("pin")
      .value
      .trim();


  // ----------------------------------------------------------
  // SI LE PIN EST DÉJÀ MÉMORISÉ
  // ----------------------------------------------------------

  if (!pin) {

    pin =
      sessionStorage.getItem(
        "poaalah_scanner_pin"
      ) || "";

  }


  // ----------------------------------------------------------
  // PIN MANQUANT
  // ----------------------------------------------------------

  if (!pin) {

    showInfo(
      "⚠️ Entre le code du personnel.",
      true
    );

    return;

  }


  // ----------------------------------------------------------
  // SAUVEGARDER LE PIN POUR LA SESSION
  // ----------------------------------------------------------

  sessionStorage.setItem(
    "poaalah_scanner_pin",
    pin
  );


  // ----------------------------------------------------------
  // METTRE LE PIN DANS LE CHAMP
  // ----------------------------------------------------------

  document
    .getElementById("pin")
    .value = pin;


  // ----------------------------------------------------------
  // ÉVITER DE DÉMARRER DEUX CAMÉRAS
  // ----------------------------------------------------------

  if (scannerRunning) {

    return;

  }


  scanProcessing = false;

  hideInfo();


  const startButton =
    document.getElementById(
      "startButton"
    );


  startButton.disabled = true;

  startButton.innerText =
    "📷 CAMÉRA ACTIVE";


  const reader =
    document.getElementById(
      "reader"
    );


  reader.innerHTML = "";


  // ----------------------------------------------------------
  // CRÉER UNE NOUVELLE INSTANCE DU SCANNER
  // ----------------------------------------------------------

  scanner =
    new Html5Qrcode(
      "reader"
    );


  // ----------------------------------------------------------
  // DÉMARRER LA CAMÉRA
  // ----------------------------------------------------------

  try {

    await scanner.start(

      {
        facingMode: "environment"
      },


      {

        fps: 10,

        qrbox: {

          width: 250,

          height: 250

        }

      },


      onScanSuccess,


      function(errorMessage) {

        // ----------------------------------------------------
        // NE RIEN AFFICHER PENDANT LA RECHERCHE DU QR
        // ----------------------------------------------------

      }

    );


    scannerRunning = true;

    startButton.disabled = true;

    startButton.innerText =
      "📷 CAMÉRA ACTIVE";


  }

  catch (error) {

    console.error(
      "Erreur caméra :",
      error
    );


    scannerRunning = false;

    scanner = null;


    startButton.disabled = false;

    startButton.innerText =
      "📷 SCANNER UN BILLET";


    showInfo(

      "❌ Impossible d'ouvrir la caméra." +
      "<br><br>" +
      "Vérifie que l'accès à la caméra " +
      "est autorisé dans ton navigateur.",

      true

    );

  }

}


// ============================================================
// QR CODE DÉTECTÉ
// ============================================================

async function onScanSuccess(
  decodedText
) {

  // ----------------------------------------------------------
  // EMPÊCHER LES DOUBLES SCANS
  // ----------------------------------------------------------

  if (
    !scannerRunning ||
    scanProcessing
  ) {

    return;

  }


  scanProcessing = true;


  // ----------------------------------------------------------
  // RÉCUPÉRER LE TICKET ID
  // ----------------------------------------------------------

  const ticketId =
    String(
      decodedText || ""
    ).trim();


  // ----------------------------------------------------------
  // VÉRIFIER LE TICKET ID
  // ----------------------------------------------------------

  if (!ticketId) {

    scanProcessing = false;

    return;

  }


  // ----------------------------------------------------------
  // RÉCUPÉRER LE PIN MÉMORISÉ
  // ----------------------------------------------------------

  const pin =
    sessionStorage.getItem(
      "poaalah_scanner_pin"
    ) ||
    document
      .getElementById("pin")
      .value
      .trim();


  // ----------------------------------------------------------
  // SÉCURITÉ : PIN MANQUANT
  // ----------------------------------------------------------

  if (!pin) {

    scanProcessing = false;


    showInfo(
      "⚠️ Code du personnel manquant.",
      true
    );


    return;

  }


  // ----------------------------------------------------------
  // MESSAGE DE VÉRIFICATION
  // ----------------------------------------------------------

  showInfo(
    "⏳ Vérification du billet..."
  );


  // ----------------------------------------------------------
  // ARRÊTER ET NETTOYER LA CAMÉRA
  // AVANT L'ENVOI
  // ----------------------------------------------------------

  await stopScanner();


  // ----------------------------------------------------------
  // PRÉPARER LE FORMULAIRE
  // ----------------------------------------------------------

  document
    .getElementById(
      "ticketIdField"
    )
    .value = ticketId;


  document
    .getElementById(
      "pinField"
    )
    .value = pin;


  // ----------------------------------------------------------
  // ENVOYER À GOOGLE APPS SCRIPT
  // ----------------------------------------------------------

  document
    .getElementById(
      "verifyForm"
    )
    .submit();

}


// ============================================================
// ARRÊTER PROPREMENT LE SCANNER
// ============================================================

async function stopScanner() {

  // ----------------------------------------------------------
  // AUCUN SCANNER
  // ----------------------------------------------------------

  if (!scanner) {

    scannerRunning = false;

    return;

  }


  // ----------------------------------------------------------
  // ARRÊTER LA CAMÉRA
  // ----------------------------------------------------------

  try {

    if (scannerRunning) {

      await scanner.stop();

    }

  }

  catch (error) {

    console.log(
      "Arrêt caméra :",
      error
    );

  }


  // ----------------------------------------------------------
  // NETTOYER COMPLÈTEMENT L'INSTANCE
  // ----------------------------------------------------------

  try {

    await scanner.clear();

  }

  catch (error) {

    console.log(
      "Nettoyage scanner :",
      error
    );

  }


  scannerRunning = false;

  scanner = null;


  // ----------------------------------------------------------
  // NETTOYER LA ZONE DU SCANNER
  // ----------------------------------------------------------

  document
    .getElementById("reader")
    .innerHTML = "";

}


// ============================================================
// AFFICHER UN MESSAGE
// ============================================================

function showInfo(
  message,
  error
) {

  const info =
    document.getElementById(
      "info"
    );


  info.innerHTML =
    message;


  info.classList.remove(
    "hidden"
  );


  if (error) {

    info.style.background =
      "#ffe0e0";


    info.style.color =
      "#8b0000";

  }

  else {

    info.style.background =
      "#eef6ff";


    info.style.color =
      "#164e7a";

  }

}


// ============================================================
// CACHER LE MESSAGE
// ============================================================

function hideInfo() {

  document
    .getElementById("info")
    .classList
    .add("hidden");

}

</script>


</body>

</html>
